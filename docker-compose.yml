services:
  tradeflow-api:
    build:
      context: https://github.com/Lavieque/tradeflow-api.git#main
    image: tradeflow-api
    container_name: tradeflow-api
    restart: always
    ports:
      - "3004:3004"
    shm_size: '256mb'
    security_opt:
      - seccomp=unconfined
    # todas as variáveis vêm do .env (ver .env.example)
    env_file: .env
